AWSTemplateFormatVersion: '2010-09-09'

Description: "AWS Service Catalog Serverless launch constraint role."

Resources:
  SCServerlessLaunchConstraintRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: SCServerlessLaunchConstraintRole
      Description: >
        Launch role assumed by AWS Service Catalog to provision
        CloudFormation-based Service Catalog products.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowServiceCatalogAssumeRole
            Effect: Allow
            Principal:
              Service:
                - servicecatalog.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub
                  arn:${AWS::Partition}:servicecatalog:${AWS::Region}:${AWS::AccountId}:*
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
      Policies:
        - PolicyName: ServiceCatalogProvisioningArtifactAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadServiceCatalogProvisioningArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: '*'
                Condition:
                  StringEquals:
                    s3:ExistingObjectTag/servicecatalog:provisioning: 'true'
        - PolicyName: ProductResourcePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowResourceTagging
                Effect: Allow
                Action:
                  - tag:GetResources
                  - tag:TagResources
                  - tag:UntagResources
                Resource: '*'
              - Sid: ProductServicePermissions
                Effect: Allow
                Action:
                  - "apigateway:*"
                  - "dynamodb:CreateTable"
                  - "dynamodb:DeleteTable"
                  - "dynamodb:DescribeTable"
                  - "ec2:AttachInternetGateway"
                  - "ec2:AuthorizeSecurityGroupIngress"
                  - "ec2:CreateInternetGateway"
                  - "ec2:CreateNetworkAcl"
                  - "ec2:CreateNetworkAclEntry"
                  - "ec2:CreateRouteTable"
                  - "ec2:CreateSecurityGroup"
                  - "ec2:CreateSubnet"
                  - "ec2:CreateTags"
                  - "ec2:CreateVpc"
                  - "ec2:DeleteInternetGateway"
                  - "ec2:DeleteNetworkAcl"
                  - "ec2:DeleteNetworkAclEntry"
                  - "ec2:DeleteRouteTable"
                  - "ec2:DeleteSecurityGroup"
                  - "ec2:DeleteSubnet"
                  - "ec2:DeleteVpc"
                  - "ec2:Describe*"
                  - "ec2:DetachInternetGateway"
                  - "ec2:ModifyVpcAttribute"
                  - "events:DeleteRule"
                  - "events:DescribeRule"
                  - "events:ListRuleNamesByTarget"
                  - "events:ListRules"
                  - "events:ListTargetsByRule"
                  - "events:PutRule"
                  - "events:PutTargets"
                  - "events:RemoveTargets"
                  - "iam:CreateRole"
                  - "iam:DeleteRole"
                  - "iam:DeleteRolePolicy"
                  - "iam:GetRole"
                  - "iam:PassRole"
                  - "iam:PutRolePolicy"
                  - "iot:CreateTopicRule"
                  - "iot:DeleteTopicRule"
                  - "iot:DisableTopicRule"
                  - "iot:EnableTopicRule"
                  - "iot:ReplaceTopicRule"
                  - "kinesis:CreateStream"
                  - "kinesis:DeleteStream"
                  - "kinesis:DescribeStream"
                  - "lambda:*"
                  - "logs:CreateLogGroup"
                  - "logs:DeleteLogGroup"
                  - "logs:DescribeLogGroups"
                  - "logs:DescribeLogStreams"
                  - "logs:FilterLogEvents"
                  - "logs:GetLogEvents"
                  - "s3:CreateBucket"
                  - "s3:DeleteBucket"
                  - "s3:DeleteBucketPolicy"
                  - "s3:DeleteObject"
                  - "s3:DeleteObjectVersion"
                  - "s3:GetObject"
                  - "s3:GetObjectVersion"
                  - "s3:ListAllMyBuckets"
                  - "s3:ListBucket"
                  - "s3:PutBucketNotification"
                  - "s3:PutBucketPolicy"
                  - "s3:PutBucketTagging"
                  - "s3:PutBucketWebsite"
                  - "s3:PutEncryptionConfiguration"
                  - "s3:PutObject"
                  - "sns:CreateTopic"
                  - "sns:DeleteTopic"
                  - "sns:GetSubscriptionAttributes"
                  - "sns:GetTopicAttributes"
                  - "sns:ListSubscriptions"
                  - "sns:ListSubscriptionsByTopic"
                  - "sns:ListTopics"
                  - "sns:SetSubscriptionAttributes"
                  - "sns:SetTopicAttributes"
                  - "sns:Subscribe"
                  - "sns:Unsubscribe"
                  - "states:CreateStateMachine"
                  - "states:DeleteStateMachine"
                Resource: '*'

Outputs:
    LaunchRoleArn:
        Value: !GetAtt SCServerlessLaunchConstraintRole.Arn
    LaunchRoleName:
        Value: !Ref SCServerlessLaunchConstraintRole
        