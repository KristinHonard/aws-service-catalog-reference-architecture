AWSTemplateFormatVersion: '2010-09-09'

Description: S3 private encrypted ServiceCatalog product. (fdp-1p4da46rq)

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  PortfolioProvider:
    Type: String
    Description: Owner and Distributor Name

  LaunchConstraintARN:
    Type: String
    Description: ARN of the launch constraint role for S3 products.

  PortfolioId:
    Type: String
    Description: The ServiceCatalog portfolio this product will be attached to.

  RepoRootURL:
    Type: String
    Description: Root url for the repo containing the product templates.

Resources:
  scs3product:
    Type: AWS::ServiceCatalog::CloudFormationProduct
    Metadata:
      com.aws.cloudformation.Context:
        why: Offers the private encrypted S3 bucket template through Service Catalog.
        must: Keep the provisioning artifact pointed at the encrypted bucket template.
    Properties:
      Name: Amazon S3 Private Encrypted Bucket
      Description: Creates a private Amazon S3 bucket with AES256 encryption and object retention on deletion.
      Owner: !Ref PortfolioProvider
      Distributor: !Ref PortfolioProvider
      SupportDescription: ITS Cloud Support
      SupportEmail: ITSCloudSupport@mathematica-mpr.com
      ProductType: CLOUD_FORMATION_TEMPLATE
      ProvisioningArtifactParameters:
        - Description: Private S3 bucket with AES256 encryption and object retention
          Info:
            LoadTemplateFromURL: !Sub '${RepoRootURL}s3/sc-template-s3-encrypted-ra.yaml'
          Name: S3 Private Encrypted Bucket v1.0

  Associates3enc:
    Type: AWS::ServiceCatalog::PortfolioProductAssociation
    Properties:
      PortfolioId: !Ref PortfolioId
      ProductId: !Ref scs3product

  constraintS3:
    Type: AWS::ServiceCatalog::LaunchRoleConstraint
    DependsOn: Associates3enc
    Properties:
      PortfolioId: !Ref PortfolioId
      ProductId: !Ref scs3product
      RoleArn: !Ref LaunchConstraintARN
      Description: !Ref LaunchConstraintARN
