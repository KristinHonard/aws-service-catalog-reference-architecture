AWSTemplateFormatVersion: '2010-09-09'

Description: S3 private MFA ServiceCatalog product. (fdp-1p4da46s2)

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  PortfolioProvider:
    Type: String
    Description: Owner and Distributor Name

  LaunchConstraintARN:
    Type: String
    Description: ARN of the launch constraint role for S3 products.

  PortfolioId:
    Type: String
    Description: The ServiceCatalog portfolio this product will be attached to.

  RepoRootURL:
    Type: String
    Description: Root url for the repo containing the product templates.

Resources:
  scs3product:
    Type: AWS::ServiceCatalog::CloudFormationProduct
    Metadata:
      com.aws.cloudformation.Context:
        why: Offers the MFA-protected private S3 bucket template through Service Catalog.
        must: Keep the provisioning artifact pointed at the MFA bucket template.
    Properties:
      Name: Amazon S3 Private Bucket with MFA Delete Restrictions
      Description: Creates a private Amazon S3 bucket with multi-factor authentication restrictions on deletion.
      Owner: !Ref PortfolioProvider
      Distributor: !Ref PortfolioProvider
      SupportDescription: ITS Cloud Support
      SupportEmail: ITSCloudSupport@mathematica-mpr.com
      ProductType: CLOUD_FORMATION_TEMPLATE
      ProvisioningArtifactParameters:
        - Description: Private S3 bucket with MFA-protected deletion
          Info:
            LoadTemplateFromURL: !Sub '${RepoRootURL}s3/sc-template-s3-mfa-ra.yaml'
          Name: S3 MFA Protected Bucket v1.0

  Associates3mfa:
    Type: AWS::ServiceCatalog::PortfolioProductAssociation
    Properties:
      PortfolioId: !Ref PortfolioId
      ProductId: !Ref scs3product

  constraints3mfa:
    Type: AWS::ServiceCatalog::LaunchRoleConstraint
    DependsOn: Associates3mfa
    Properties:
      PortfolioId: !Ref PortfolioId
      ProductId: !Ref scs3product
      RoleArn: !Ref LaunchConstraintARN
      Description: !Ref LaunchConstraintARN
